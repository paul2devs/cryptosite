<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="NexaCrypto — Digital Asset Investment Platform">
  <title>NexaCrypto — Digital Asset Investment Platform</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121214" />
      <stop offset="0.55" stop-color="#0F0F10" />
      <stop offset="1" stop-color="#0A0A0B" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E6CB8C" />
      <stop offset="0.5" stop-color="#C6A15B" />
      <stop offset="1" stop-color="#9E7A36" />
    </linearGradient>
    <radialGradient id="glowGold" cx="0.15" cy="0.12" r="0.6">
      <stop offset="0" stop-color="#C6A15B" stop-opacity="0.22" />
      <stop offset="1" stop-color="#C6A15B" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.92" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#16C784" stop-opacity="0.14" />
      <stop offset="1" stop-color="#16C784" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glowGold)" />
  <rect width="1200" height="630" fill="url(#glowGreen)" />

  <!-- Abstract market motif -->
  <g opacity="0.9">
    <path
      d="M700 470 L790 400 L860 430 L960 320 L1060 360 L1140 250"
      fill="none"
      stroke="url(#gold)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
      opacity="0.55"
    />
    <g fill="url(#gold)" opacity="0.35">
      <rect x="770" y="410" width="10" height="40" rx="5" />
      <rect x="930" y="340" width="10" height="52" rx="5" />
      <rect x="1090" y="270" width="10" height="46" rx="5" />
    </g>
    <circle cx="1140" cy="250" r="7" fill="#16C784" opacity="0.85" />
  </g>

  <!-- Brand mark -->
  <g transform="translate(96,104)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#15161A" stroke="#2A2B2F" stroke-width="1.5" />
    <path
      d="M19 38V18l18 20V18"
      fill="none"
      stroke="url(#gold)"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <circle cx="37" cy="18" r="2.6" fill="url(#gold)" />
  </g>

  <text
    x="96"
    y="270"
    font-family="'Space Grotesk','Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
    font-size="76"
    font-weight="600"
    letter-spacing="-1.5"
    fill="#F5F5F7"
  >NexaCrypto</text>

  <text
    x="98"
    y="330"
    font-family="'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
    font-size="27"
    font-weight="600"
    letter-spacing="3.4"
    fill="#C6A15B"
  >DIGITAL ASSET INVESTMENT PLATFORM</text>

  <rect x="98" y="368" width="88" height="3" rx="1.5" fill="url(#gold)" />

  <text
    x="98"
    y="424"
    font-family="'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif"
    font-size="23"
    font-weight="400"
    fill="#9CA3AF"
  >Manage your digital asset portfolio with clarity.</text>
</svg>
